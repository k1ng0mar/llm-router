# router.example.yaml — copy this to router.yaml and fill in your keys.
# The router reads router.yaml at startup. Never commit the real one.
#
# `./llm-router validate --config router.example.yaml` passes as-is, so you can
# check your edits the same way before starting the server.

db: router.db
listen: 127.0.0.1:8015

# Pick a strong random value. Every API call and dashboard request must send
# it as a Bearer token.
router_key: change-me
insecure_no_auth: false

# Source for the model catalog (model names, context windows, capabilities).
catalog_url: https://models.dev/api.json

# Optional: per-provider remaining-quota snapshots for quota-aware pool
# ordering. Point this at a JSON file a plan tracker keeps fresh, e.g.
#   {"gemini": {"percent_left": 40, "reset_at": "2026-08-22T18:00:00Z"}}
# Pool entries whose provider is running low (<25% left) sort after providers
# with headroom; exhausted ones sink further. Providers absent from the file
# are unpenalized, declared order is kept within each bucket, and explicit
# chains / single-model refs bypass it entirely. Leave empty to disable.
quota_file: ""

# The pool used when a request doesn't say which one it wants.
default: chat

# Pools are ordered fallback lists of provider:model. Every provider named here
# must exist under `providers` below, or the config fails to load.
pools:
  chat:
  - groq:llama-3.3-70b-versatile
  - openrouter:google/gemma-4-31b-it:free

  code:
  - openrouter:z-ai/glm-5.2
  - my-custom:deepseek-v4-flash

  # The media pool serves every non-text modality: images, audio, and video.
  # A request carrying any of them lands here — unless a keyword heuristic or an
  # X-Route-Pool header says otherwise — and the capability gate picks the first
  # entry that can actually handle the modality that arrived. That makes it safe
  # to mix single-modality models in one list: an audio request skips past the
  # image-only entries on its own.
  media:
  - openrouter:nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
  - my-custom:some-omni-model

chains: {}
tiers: {}

# When an image arrives alongside a code/reasoning signal and the target pool's
# first model can see images, send the pixels straight there instead of running
# the describe-first hop.
allow_direct_vision: true

# Legacy image-describe list, superseded by the `media` pool above (which wins
# when both are set). Kept so older configs keep working.
vision: []

providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    keys: []

  # Everything that isn't openrouter or ollama goes under `custom`.
  custom:
    groq:
      base_url: https://api.groq.com/openai/v1
      keys: []
      # Params this upstream rejects but others accept.
      strip_params:
      - reasoning_effort

      # For DeepSeek-family gateways that answer 400 "messages[N].
      # reasoning_content is required for thinking tool-call history". Puts a
      # placeholder back into any assistant message carrying tool_calls that
      # arrived without reasoning_content, which OpenAI-compatible clients drop
      # because it is not part of the OpenAI schema. Off unless set.
      repair_reasoning_content: false

    # An OpenAI-compatible custom provider. Set api_mode: anthropic or
    # api_mode: gemini to talk to those native APIs directly.
    my-custom:
      base_url: https://api.example.com/v1
      keys: []
      api_mode: openai

    # Deployment-links provider (e.g. Modal) — each URL serves exactly one
    # model. The router auto-discovers the model at each link via /v1/models
    # and pools them all under one provider name. Use this when a provider
    # doesn't expose one base URL for multiple models.
    # my-modal:
    #   preset: true
    #   api_mode: openai
    #   deployment_links:
    #     - url: https://my-deployment.modal.direct/v1
    #       key: wk-my-key-1
    #     - url: https://another-deployment.modal.direct/v1
    #       key: wk-my-key-2

      # Cap max_tokens per model — an upper bound applied before the request
      # goes upstream.
      model_limits:
        deepseek-v4-flash: 8192

      # Per-model media overrides, one value per form: auto | allow | deny.
      #   auto  — follow the model catalog. The default, and what every model
      #           not listed here gets.
      #   allow — force the form through even though the catalog says the model
      #           can't take it. Use when you know it has native support the
      #           catalog under-reports.
      #   deny  — never send this form to this model, whatever the catalog says.
      #
      # These outrank the catalog, so they are how you keep a mixed-modality
      # media pool honest. Editable per model in the dashboard under
      # Providers → View Details → Models & Routing.
      media_policies:
        some-omni-model:
          image: allow
          audio: allow
          video: deny

classifier:
  hints_first: true
  heuristics:
    code:
    - 'def '
    - 'import '
    - 'func '

fallback:
  # Time to first byte for ONE key — not total response time. On expiry the
  # router moves to the next key, then the next provider; a timeout never fails
  # the request by itself. Bodies stream freely once headers arrive, and there is
  # no overall request deadline. Applied at startup: changing this needs a
  # restart, not just a SIGHUP.
  timeout_s: 90

  # round_robin | least_used — how keys are picked within a provider.
  strategy: round_robin

  # How long a key sits out after a 429 with no Retry-After. Only 429 (cooldown)
  # and 401 (dead until you rotate it) affect a key's availability; a 5xx or a
  # timeout leaves it usable, since those describe the upstream rather than the
  # key, and keys are shared by all of a provider's models.
  key_cooldown_s: 60

  # Circuit breaker for a whole `provider:model` candidate. After it fails with
  # a transport error, a TTFB timeout, or a 5xx, it is skipped for this long
  # instead of being re-dialed at the front of the pool every time — otherwise a
  # dead upstream charges its full timeout_s to every request that passes
  # through. A 4xx does not trip it (that is about the request or the key), and
  # a 200 clears it at once. Skipped candidates are still logged as "excluded"
  # attempts. If every candidate in a pool is cooling down they are all tried
  # anyway, so one bad minute cannot become a hard 503 for the whole window.
  # 0 disables the breaker.
  provider_cooldown_s: 60

  # Escalation. Count *consecutive* failures of the same provider:model — the
  # streak survives the short cooldown expiring, and only a 200 resets it — and
  # once it reaches this many, swap the short cooldown for provider_lockout_s.
  # A provider that is genuinely down then stops being re-probed every minute.
  # One request counts once: a provider with six keys that fails on all six has
  # failed once, not six times. Set the threshold to 0 to disable escalation.
  provider_failure_threshold: 5

  # The escalated window, in seconds (10 minutes). Called "lockout" rather
  # than "timeout" because timeout_s above already means the per-attempt TTFB
  # deadline. 0 also disables escalation.
  provider_lockout_s: 600

  # In-place retry for gateway blips. A non-streamed attempt answered with a
  # 502/503/504 (and no Retry-After) is retried on the SAME key this many times
  # — with jittered backoff — before falling through to the next key/provider.
  # A blip shouldn't burn the next candidate's quota. 0 disables (the default);
  # values above 3 are clamped.
  retry_transient_max: 0
